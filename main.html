<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Manager</title>
    <link rel="stylesheet" href="main.css">
    <!-- Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <h1><i class="fa-solid fa-user-graduate"></i> Student Manager</h1>
        <div class="header-actions">
            <button id="exportCsvBtn" class="btn btn-secondary" title="Export CSV"><i class="fa-solid fa-file-csv"></i> Export</button>
            <button id="clearAllBtn" class="btn btn-danger" title="Clear All"><i class="fa-solid fa-trash"></i> Clear All</button>
            <label class="theme-toggle" title="Toggle theme">
                <input type="checkbox" id="themeToggle" />
                <span class="toggle"><i class="fa-solid fa-sun"></i><i class="fa-solid fa-moon"></i></span>
            </label>
        </div>
    </header>

    <div class="container">
        <section class="form">
            <div class="field">
                <label for="studentName"><i class="fa-solid fa-id-card"></i> Name</label>
                <input type="text" id="studentName" placeholder="Enter student name" autocomplete="off">
            </div>
            <div class="field">
                <label for="studentAge"><i class="fa-solid fa-cake-candles"></i> Age</label>
                <input type="number" id="studentAge" placeholder=">= 18" min="0" autocomplete="off">
            </div>
            <div class="actions">
                <button id="addStudentBtn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add</button>
                <button id="updateStudentBtn" class="btn btn-success hidden"><i class="fa-solid fa-floppy-disk"></i> Update</button>
                <button id="resetFormBtn" class="btn btn-secondary"><i class="fa-solid fa-rotate-left"></i> Reset</button>
            </div>
            <input type="hidden" id="editId" value="">
        </section>

        <section class="toolbar">
            <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search by name or age...">
            </div>
            <div class="bulk-actions">
                <button id="deleteSelectedBtn" class="btn btn-danger" disabled><i class="fa-solid fa-trash-can"></i> Delete Selected</button>
            </div>
        </section>

        <section class="table-wrap">
            <table id="Table">
                <thead>
                    <tr>
                        <th class="select-col"><input type="checkbox" id="selectAll"></th>
                        <th data-sort="id">ID <i class="fa-solid fa-sort"></i></th>
                        <th data-sort="name">Name <i class="fa-solid fa-sort"></i></th>
                        <th data-sort="age">Age <i class="fa-solid fa-sort"></i></th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </section>

        <section class="stats">
            <div class="stat"><i class="fa-solid fa-users"></i> Total: <span id="statTotal">0</span></div>
            <div class="stat"><i class="fa-solid fa-chart-simple"></i> Avg Age: <span id="statAvg">0</span></div>
        </section>
    </div>

    <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>

    <script src="main.js"></script>
</body>
</html>
